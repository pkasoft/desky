name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release
      - name: Rename Artifact
        run: Move-Item target/release/resky.exe resky-windows-x64.exe
      - name: Upload Windows Binary
        uses: softprops/action-gh-release@v2
        with:
          files: resky-windows-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Musl Release
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Rename Artifact
        run: mv target/x86_64-unknown-linux-musl/release/resky resky-linux-x64
      - name: Upload Linux Binary
        uses: softprops/action-gh-release@v2
        with:
          files: resky-linux-x64
