[package]
name = "desky"
version = "0.1.0"
edition = "2024"
authors = ["PraxiumX <pkasoft.studio@gmail.com>"]
description = "Zero-friction, high-performance peer-to-peer remote desktop built with Rust"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    ".",
    "crates/desky-server",
]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
jpeg-encoder = "0.6"
zune-jpeg = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["allow-unsafe-code", "xtest"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
